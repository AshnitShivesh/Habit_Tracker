<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Habit Tracker</h1>
            <p>Build better habits, one day at a time.</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span id="totalHabits">0</span>
                <p>Total Habits</p>
            </div>

            <div class="stat-card">
                <span id="completedToday">0</span>
                <p>Completed Today</p>
            </div>

            <div class="stat-card">
                <span id="bestStreak">0</span>
                <p>Best Streak</p>
            </div>
        </section>

        <section class="add-habit">
            <input type="text" id="habitInput" placeholder="Enter a new habit...">
            <button id="addHabitBtn">Add Habit</button>
        </section>

        <section class="habits-section">
            <div class="section-header">
                <h2>Today's Habits</h2>
                <span id="today"></span>
            </div>

            <div id="habitList"></div>

            <p id="emptyMessage">No habits yet. Add your first habit! 🚀</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
